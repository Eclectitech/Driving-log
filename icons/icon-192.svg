<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="nightPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>

  <!-- Celestial Symbols: Day Sun & Night Crescent Moon -->
  <circle cx="160" cy="140" r="30" fill="#f59e0b" opacity="0.9"/>
  <path d="M 330 110 A 34 34 0 1 0 376 160 A 28 28 0 0 1 330 110 Z" fill="url(#nightPurple)"/>

  <!-- Road converging to horizon -->
  <polygon points="216,210 296,210 400,430 112,430" fill="url(#roadGrad)"/>
  <line x1="216" y1="210" x2="112" y2="430" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="296" y1="210" x2="400" y2="430" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Dashed center divider line -->
  <line x1="256" y1="215" x2="256" y2="245" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="265" x2="256" y2="305" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="330" x2="256" y2="385" stroke="#fcd34d" stroke-width="10" stroke-linecap="round"/>

  <!-- Steering Wheel -->
  <circle cx="256" cy="300" r="160" fill="none" stroke="url(#blueGlow)" stroke-width="24"/>
  <circle cx="256" cy="300" r="44" fill="#0f172a" stroke="url(#blueGlow)" stroke-width="8"/>
  <text x="256" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle">VA</text>
  
  <line x1="100" y1="300" x2="212" y2="300" stroke="url(#blueGlow)" stroke-width="16" stroke-linecap="round"/>
  <line x1="300" y1="300" x2="412" y2="300" stroke="url(#blueGlow)" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="344" x2="256" y2="456" stroke="url(#blueGlow)" stroke-width="16" stroke-linecap="round"/>

  <!-- 45 Hours Badge -->
  <g transform="translate(196, 44)">
    <rect width="120" height="34" rx="17" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">45 HRS</text>
  </g>
</svg>
